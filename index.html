<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>퇴근 타이머</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: one compact card sized for a narrow Notion column — label row, big countdown, timeline bar */
:root {
  --bg: #ffffff;
  --fg: #23303a;
  --muted: #7d8b96;
  --line: #e3eaef;
  --track: #edf2f6;
  --accent: #3f8fb5;
  --accent-soft: #d9ecf5;
  --done: #2f9e6e;
  --over: #c4703a;
  --font-body: "IBM Plex Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #191919; --fg: #e4eaee; --muted: #8b979f; --line: #2c3236; --track: #262c30;
    --accent: #6cb6d8; --accent-soft: #1f3540; --done: #5cc497; --over: #e09662;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #191919; --fg: #e4eaee; --muted: #8b979f; --line: #2c3236; --track: #262c30;
  --accent: #6cb6d8; --accent-soft: #1f3540; --done: #5cc497; --over: #e09662;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 13px;
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.card { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 14px; }

.head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.controls { display: flex; align-items: center; gap: 6px; }
input[type="time"], select {
  font: 500 12px var(--font-num); color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; height: 28px;
}
input[type="time"]:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button {
  font: 500 12px var(--font-body); color: var(--accent); background: var(--accent-soft);
  border: 0; border-radius: 6px; padding: 0 10px; height: 28px; cursor: pointer;
}
button:hover { filter: brightness(.97); }

.count {
  font-family: var(--font-num); font-weight: 500; font-size: clamp(34px, 12vw, 46px);
  line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums;
}
.count small { font-size: .42em; color: var(--muted); letter-spacing: 0; margin-left: 2px; }
.status { margin-top: 6px; color: var(--muted); font-size: 12px; }
.status b { color: var(--fg); font-weight: 600; }

.bar { height: 8px; background: var(--track); border-radius: 99px; overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .6s ease; }
.ends { display: flex; justify-content: space-between; margin-top: 6px; font: 12px var(--font-num); color: var(--muted); font-variant-numeric: tabular-nums; }
.ends span:last-child { color: var(--fg); font-weight: 500; }

.card[data-state="done"] .fill { background: var(--done); }
.card[data-state="done"] .count { color: var(--done); }
.card[data-state="over"] .fill { background: var(--over); }
.card[data-state="over"] .count { color: var(--over); }
.card[data-state="empty"] .count { color: var(--line); }

@media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
</style>
</head>
<body>
<main class="card" id="card" data-state="empty">
  <div class="head">
    <span class="label" id="label">퇴근까지</span>
    <div class="controls">
      <input type="time" id="start" aria-label="출근 시각">
      <select id="hours" aria-label="근무 시간">
        <option value="480">8h</option>
        <option value="540" selected>9h</option>
        <option value="600">10h</option>
      </select>
      <button type="button" id="now">지금 출근</button>
    </div>
  </div>

  <div>
    <div class="count" id="count">--:--<small>:--</small></div>
    <div class="status" id="status">출근 시각을 입력하면 시작돼요</div>
  </div>

  <div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="ends"><span id="from">출근 --:--</span><span id="to">퇴근 --:--</span></div>
  </div>
</main>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const card = $("card"), startEl = $("start"), hoursEl = $("hours");
  const pad = (n) => String(n).padStart(2, "0");
  const todayKey = () => { const d = new Date(); return "lt-start-" + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()); };
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };

  // Restore today's start time and the saved work-hours choice
  const savedHours = store.get("lt-hours");
  if (savedHours) hoursEl.value = savedHours;
  const savedStart = store.get(todayKey());
  if (savedStart) startEl.value = savedStart;

  const hhmm = (d) => pad(d.getHours()) + ":" + pad(d.getMinutes());
  const fmt = (ms) => {
    const s = Math.floor(ms / 1000);
    return pad(Math.floor(s / 3600)) + ":" + pad(Math.floor(s / 60) % 60) + "<small>:" + pad(s % 60) + "</small>";
  };

  let shownKey = todayKey();
  function tick() {
    // New day: clear yesterday's entry from the input
    if (todayKey() !== shownKey) { shownKey = todayKey(); startEl.value = store.get(shownKey) || ""; }

    const v = startEl.value;
    if (!v) {
      card.dataset.state = "empty";
      $("label").textContent = "퇴근까지";
      $("count").innerHTML = "--:--<small>:--</small>";
      $("status").textContent = "출근 시각을 입력하면 시작돼요";
      $("fill").style.width = "0";
      $("from").textContent = "출근 --:--";
      $("to").textContent = "퇴근 --:--";
      return;
    }
    const [h, m] = v.split(":").map(Number);
    const now = new Date();
    const start = new Date(now); start.setHours(h, m, 0, 0);
    const total = Number(hoursEl.value) * 60000;
    const end = new Date(start.getTime() + total);
    const left = end - now;
    const pct = Math.min(100, Math.max(0, ((now - start) / total) * 100));

    $("from").textContent = "출근 " + v;
    $("to").textContent = "퇴근 " + hhmm(end);
    $("fill").style.width = pct + "%";

    if (now < start) {
      card.dataset.state = "empty";
      $("label").textContent = "출근 전";
      $("count").innerHTML = fmt(start - now);
      $("status").textContent = "출근 시각까지 남은 시간";
    } else if (left > 0) {
      card.dataset.state = "running";
      $("label").textContent = "퇴근까지";
      $("count").innerHTML = fmt(left);
      $("status").innerHTML = "<b>" + Math.floor(pct) + "%</b> 근무 완료";
    } else if (-left < 60000 * 10) {
      card.dataset.state = "done";
      $("label").textContent = "퇴근 시간";
      $("count").innerHTML = fmt(-left);
      $("status").innerHTML = "<b>퇴근하세요!</b> 오늘도 수고했어요";
    } else {
      card.dataset.state = "over";
      $("label").textContent = "초과 근무";
      $("count").innerHTML = "+" + fmt(-left);
      $("status").innerHTML = "<b>" + hhmm(end) + "</b>부터 초과 중";
    }
  }

  startEl.addEventListener("input", () => { store.set(todayKey(), startEl.value); tick(); });
  hoursEl.addEventListener("change", () => { store.set("lt-hours", hoursEl.value); tick(); });
  $("now").addEventListener("click", () => {
    startEl.value = hhmm(new Date());
    store.set(todayKey(), startEl.value);
    tick();
  });

  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
